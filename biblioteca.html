<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca de objetos · Estúdio Raio-X</title>
<style>
:root{--bg:#14181f;--pn:#1c222c;--ln:#2c3544;--tx:#e8edf5;--mu:#93a0b4;--ok:#3fbf78;--aj:#e8b13a;--rj:#e5565b;--ac:#4b8dff}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,sans-serif;display:grid;grid-template-columns:300px 1fr 330px;grid-template-rows:auto 1fr}
header{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--ln);background:var(--pn)}
header h1{font-size:16px;margin:0}header .mu{color:var(--mu);font-size:12px}header a{color:var(--ac);text-decoration:none;font-size:13px}
#lista{overflow:auto;border-right:1px solid var(--ln);background:var(--pn);padding:8px}
.lote{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:12px 6px 6px}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:6px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.item:hover{background:#232b38}.item.sel{background:#263044;border-color:var(--ac)}
.item img{width:56px;height:56px;border-radius:8px;background:#0f131a;object-fit:cover}
.item b{display:block;font-size:13px}.item small{color:var(--mu)}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.aj{color:var(--aj);border-color:var(--aj)}.tag.rj{color:var(--rj);border-color:var(--rj)}
#centro{position:relative;min-width:0}#cv{width:100%;height:100%;display:block}
#hud{position:absolute;left:12px;top:10px;font-size:12px;color:var(--mu);pointer-events:none;text-shadow:0 1px 2px #000}
#barra{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input,textarea{font:inherit;color:var(--tx);background:#252d3b;border:1px solid var(--ln);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{background:#2d3748}button.on{background:var(--ac);border-color:var(--ac)}
#lado{overflow:auto;border-left:1px solid var(--ln);background:var(--pn);padding:12px}
#lado h2{font-size:15px;margin:0 0 4px}#lado p{margin:4px 0 10px;color:var(--mu);font-size:12.5px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1}
.par{display:grid;grid-template-columns:1fr 1.2fr;gap:6px;align-items:center;margin:4px 0;font-size:12.5px}.par label{color:var(--mu)}
.par input[type=color]{padding:0;height:30px;width:100%}.par input[type=number],.par input[type=text],.par select{width:100%}
textarea{width:100%;min-height:110px;resize:vertical}
.bt{padding:9px 6px}.bt.ok{border-color:var(--ok);color:var(--ok)}.bt.aj{border-color:var(--aj);color:var(--aj)}.bt.rj{border-color:var(--rj);color:var(--rj)}
.bt.ok.on{background:var(--ok);color:#06210f}.bt.aj.on{background:var(--aj);color:#2a1d00}.bt.rj.on{background:var(--rj);color:#2b0507}
#msg{font-size:12px;color:var(--mu);min-height:16px}
h3{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}
@media(max-width:900px){body{grid-template-columns:1fr;grid-template-rows:auto 220px 60vh auto}#lista,#lado{border:0}header{grid-column:1}}
</style></head><body>
<header><h1>Biblioteca de objetos</h1><span class="mu" id="resumo"></span><span style="flex:1"></span><button id="bNovo" title="Gera o pedido para a IA (Codex ou Claude Code) criar um objeto que não existe">➕ Novo objeto</button><button id="bVerif" title="Constrói todos os objetos e roda todas as animações procurando erro">🔍 Verificar tudo</button><button id="bBaixar" title="Baixa um arquivo com suas anotações">Baixar anotações</button><a href="index.html">← voltar ao estúdio</a></header>
<aside id="lista"></aside>
<main id="centro"><canvas id="cv"></canvas><div id="hud"></div>
  <div id="barra"><button id="bGirar" class="on">Girar</button><button id="bRegua">Régua 1 m</button><button id="bPanorama">Ver todos lado a lado</button><button id="bRepouso">Repouso</button><span id="anims" style="display:contents"></span></div></main>
<aside id="lado"><div id="info"></div></aside>
<script src="lib/three.min.js"></script><script src="lib/OrbitControls.js"></script>
<script src="modulos/biblioteca/base.js"></script><script src="modulos/biblioteca/lote1.js"></script><script src="modulos/biblioteca/lote2.js"></script><script src="modulos/biblioteca/lote3.js"></script><script src="modulos/biblioteca/lote4.js"></script><script src="modulos/biblioteca/lote5.js"></script><script src="modulos/biblioteca/lote6.js"></script><script src="modulos/biblioteca/lote7.js"></script><script src="modulos/biblioteca/lote8.js"></script><script src="modulos/biblioteca/lote9.js"></script><script src="modulos/biblioteca/meus_objetos.js"></script>
<script>
const LIB = window.RAIOX_LIB, T = THREE, $ = id => document.getElementById(id);
const estado = {sel:null, params:{}, cena:null, anim:null, relogio:0, giro:true, regua:false, pano:false, val:{}};
/* ---------- renderer / cena ---------- */
const cv = $('cv'), R = new T.WebGLRenderer({canvas:cv, antialias:true, preserveDrawingBuffer:true});
R.shadowMap.enabled = true; R.setPixelRatio(Math.min(2, devicePixelRatio));
const cena = new T.Scene(); cena.background = new T.Color('#2a3446');
const cam = new T.PerspectiveCamera(36, 1, .05, 200), ctl = new T.OrbitControls(cam, cv); ctl.enableDamping = true;
cena.add(new T.HemisphereLight('#f4f7ff', '#8a8f99', .75));
const sol = new T.DirectionalLight('#fff1dc', .85); sol.position.set(4, 7, 5); sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, {left:-8, right:8, top:8, bottom:-8, near:.5, far:30}); cena.add(sol);
const chao = new T.Mesh(new T.CircleGeometry(30, 48), new T.MeshStandardMaterial({color:'#39465c', roughness:1})); chao.rotation.x = -Math.PI/2; chao.position.y = -.002; chao.receiveShadow = true; cena.add(chao);
const grade = new T.GridHelper(30, 30, '#566580', '#44526a'); grade.position.y = 0; grade.material.opacity = .35; grade.material.transparent = true; cena.add(grade);
const palco = new T.Group(); cena.add(palco);
function ajusta(){ const r = cv.parentElement.getBoundingClientRect(); R.setSize(r.width, r.height, false); cam.aspect = r.width/r.height; cam.updateProjectionMatrix(); }
addEventListener('resize', ajusta);
/* ---------- objetos ---------- */
let atual = null;
function limpa(){ while(palco.children.length) palco.remove(palco.children[0]); atual = null; }
function enquadra(dim, centro){
  const h = dim[1], l = Math.max(dim[0], dim[2]), d = Math.max(h*1.6, l*1.5, 2.2);
  ctl.target.set(centro ? centro[0] : 0, h*.45, centro ? centro[2] : 0); cam.position.set(ctl.target.x + d*.7, h*.7 + d*.35, ctl.target.z + d*.9); ctl.update();
}
function mostra(id){
  estado.pano = false; $('bPanorama').classList.remove('on'); limpa();
  atual = LIB.construir(id, estado.params); if(!atual) return;
  palco.add(atual.obj); enquadra(atual.dim); estado.anim = null; estado.relogio = 0; regua();
  $('hud').textContent = atual.def.nome+' · '+atual.dim.map(v => v.toFixed(1)).join(' × ')+' m (l × a × p)';
}
let reguaObj = null;
function regua(){
  if(reguaObj){ cena.remove(reguaObj); reguaObj = null; } if(!estado.regua || !atual) return;
  const g = new T.Group(), m = new T.MeshBasicMaterial({color:'#ffd60a'}), x = -(atual.dim[0]/2 + .5);
  const barra = new T.Mesh(new T.BoxGeometry(.03, 1, .03), m); barra.position.set(x, .5, 0); g.add(barra);
  for(let i = 0; i <= 10; i++){ const t = new T.Mesh(new T.BoxGeometry(i%5 === 0 ? .2 : .1, .012, .012), m); t.position.set(x + .05, i/10, 0); g.add(t); }
  cena.add(g); reguaObj = g;
}
function panorama(){
  estado.pano = true; limpa(); let x = 0; const itens = LIB.ordem.map(id => LIB.construir(id)).filter(Boolean), gap = .8, ext = [];
  itens.forEach(it => { const w = Math.max(it.dim[0], it.dim[2]); x += w/2; it.obj.position.x = x; palco.add(it.obj); x += w/2 + gap; ext.push(it.dim[1]); });
  const total = x - gap; palco.position.x = -total/2; const h = Math.max(...ext);
  ctl.target.set(0, h*.4, 0); cam.position.set(0, h*.8, Math.max(total*.62, 6)); ctl.update(); $('hud').textContent = 'Panorama · '+itens.length+' objetos na mesma escala (1 m = 1 quadrado da grade)'; estado.anim = null;
}
/* ---------- animações ---------- */
function botoesAnim(){
  const box = $('anims'); box.innerHTML = ''; if(!atual) return;
  Object.keys(atual.def.animacoes).forEach(n => { const a = atual.def.animacoes[n], b = document.createElement('button'); b.textContent = '▶ '+n+(a.loop ? ' ∞' : ''); b.title = a.desc; b.onclick = () => { estado.anim = {n, t0:performance.now()/1000}; }; box.appendChild(b); });
}
function quadro(){
  requestAnimationFrame(quadro); ctl.autoRotate = estado.giro && !estado.anim && !estado.pano; ctl.autoRotateSpeed = 1.2; ctl.update();
  if(atual && !estado.pano){
    LIB.reset(atual.partes);
    if(estado.anim){ const a = atual.def.animacoes[estado.anim.n], t = performance.now()/1000 - estado.anim.t0; if(a){ if(a.loop || t < a.dur + .6){ a.aplicar(atual.partes, a.loop ? t : Math.min(t, a.dur), {}, atual.obj); } else { a.aplicar(atual.partes, a.dur, {}, atual.obj); } } }
  }
  R.render(cena, cam);
}
/* ---------- miniaturas ---------- */
function miniaturas(){
  const rt = new T.WebGLRenderTarget(160, 160), out = {}; const c2 = document.createElement('canvas'); c2.width = c2.height = 160; const x2 = c2.getContext('2d');
  LIB.ordem.forEach(id => {
    limpa(); const it = LIB.construir(id); palco.add(it.obj); const d = Math.max(it.dim[1]*1.7, Math.max(it.dim[0], it.dim[2])*1.6, 2);
    const c = new T.PerspectiveCamera(36, 1, .05, 100); c.position.set(d*.75, it.dim[1]*.7 + d*.3, d*.95); c.lookAt(0, it.dim[1]*.42, 0);
    const buf = new Uint8Array(160*160*4); R.setRenderTarget(rt); R.render(cena, c); R.readRenderTargetPixels(rt, 0, 0, 160, 160, buf); R.setRenderTarget(null);
    const im = x2.createImageData(160, 160); for(let y = 0; y < 160; y++) for(let x = 0; x < 160; x++){ const a = ((159 - y)*160 + x)*4, b = (y*160 + x)*4; im.data[b] = buf[a]; im.data[b+1] = buf[a+1]; im.data[b+2] = buf[a+2]; im.data[b+3] = 255; }
    x2.putImageData(im, 0, 0); out[id] = c2.toDataURL('image/jpeg', .85);
  });
  limpa(); return out;
}
/* ---------- lista e painel ---------- */
let thumbs = {};
const ROT = {ok:'aprovado', aj:'ajustar', rj:'rejeitado'};
function resumo(){ const v = Object.values(estado.val), n = k => v.filter(x => x.estado === k).length; $('resumo').textContent = LIB.ordem.length+' objetos · '+n('ok')+' aprovados · '+n('aj')+' para ajustar · '+n('rj')+' rejeitados'; }
function lista(){
  const el = $('lista'); el.innerHTML = ''; let lote = null;
  LIB.ordem.forEach(id => {
    const d = LIB.itens[id]; if(d.lote !== lote){ lote = d.lote; const h = document.createElement('div'); h.className = 'lote'; h.textContent = typeof lote === 'number' ? 'Lote '+lote : 'Meus objetos'; el.appendChild(h); }
    const v = estado.val[id], it = document.createElement('div'); it.className = 'item'+(estado.sel === id ? ' sel' : ''); it.dataset.id = id;
    it.innerHTML = '<img alt=""><div><b></b><small></small></div><span class="tag"></span>';
    it.querySelector('img').src = thumbs[id] || ''; it.querySelector('b').textContent = d.nome; it.querySelector('small').textContent = d.categoria;
    const tg = it.querySelector('.tag'); tg.textContent = v ? ROT[v.estado] : 'pendente'; if(v) tg.classList.add(v.estado);
    it.onclick = () => selecionar(id); el.appendChild(it);
  }); resumo();
}
function selecionar(id){
  estado.sel = id; const d = LIB.itens[id]; estado.params = Object.assign(d.defaults(), (estado.val[id] && estado.val[id].params) || {}); mostra(id); botoesAnim(); painel(); lista();
}
function painel(){
  const d = LIB.itens[estado.sel], v = estado.val[estado.sel] || {}, el = $('info'); if(!d){ el.innerHTML = '<p>Escolha um objeto na lista.</p>'; return; }
  el.innerHTML = '<h2></h2><p id="ds"></p><h3>Parâmetros</h3><div id="ps"></div><h3>Validação</h3><div class="row"><button class="bt ok">✓ Aprovar</button><button class="bt aj">✎ Ajustar</button><button class="bt rj">✗ Rejeitar</button></div><textarea id="co" placeholder="Comentário para o ajuste (o que está feio, o que falta, o que mudar)…"></textarea><div class="row"><button id="sv">Salvar comentário</button></div><div id="msg"></div><h3>Partes e animações</h3><p id="pa"></p>';
  el.querySelector('h2').textContent = d.nome; $('ds').textContent = d.descricao; $('co').value = v.comentario || '';
  const ps = $('ps'); Object.keys(d.params).forEach(k => {
    const p = d.params[k], val = estado.params[k], row = document.createElement('div'); row.className = 'par'; const lb = document.createElement('label'); lb.textContent = k; lb.title = p.desc || ''; row.appendChild(lb);
    let inp; if(p.opcoes){ inp = document.createElement('select'); p.opcoes.forEach(o => { const op = document.createElement('option'); op.value = op.textContent = String(o); inp.appendChild(op); }); inp.value = String(val); }
    else if(typeof p.padrao === 'number'){ inp = document.createElement('input'); inp.type = 'number'; inp.step = '0.1'; inp.value = val; }
    else if(typeof p.padrao === 'string' && /^#[0-9a-f]{6}$/i.test(p.padrao)){ inp = document.createElement('input'); inp.type = 'color'; inp.value = val || p.padrao; }
    else { inp = document.createElement('input'); inp.type = 'text'; inp.value = val || ''; }
    inp.onchange = () => { estado.params[k] = typeof p.padrao === 'number' ? +inp.value : inp.value; mostra(estado.sel); botoesAnim(); };
    row.appendChild(inp); ps.appendChild(row);
  });
  $('pa').textContent = 'Partes: '+Object.keys(atual.partes).join(', ')+'. Animações: '+Object.keys(d.animacoes).join(', ')+'.';
  el.insertAdjacentHTML('beforeend', '<h3>Pedir mudança neste objeto</h3><p>Descreva o ajuste ou a animação nova. Baixe o pedido e entregue ao Codex ou ao Claude Code (aberto na pasta do estúdio); ele altera o arquivo e você recarrega esta página.</p>'
    + '<textarea id="pd" placeholder="Ex.: a porta precisa abrir de verdade; nova animação \'tremer\' quando o vento passa; trocar o telhado por telha de barro; deixar a janela maior…"></textarea>'
    + '<div class="row"><button id="pdB">Baixar pedido (.md)</button><button id="pdC">Copiar pedido</button></div><span class="mu" id="pdM"></span>');
  $('pd').value = v.pedido || ''; $('pd').oninput = () => { const r = estado.val[estado.sel] || {id: estado.sel, estado: 'aj'}; r.pedido = $('pd').value; r.id = estado.sel; estado.val[estado.sel] = r; try{ localStorage.setItem('rx-bib-val', JSON.stringify(estado.val)); }catch(e){} };
  $('pdB').onclick = () => { const t = promptObjeto(estado.sel, $('pd').value); baixar('pedido-'+estado.sel+'.md', t); salvar(v.estado || 'aj', true); $('pdM').textContent = 'Pedido baixado: entregue ao Codex/Claude Code. Quando ele terminar, recarregue (F5).'; };
  $('pdC').onclick = () => { const t = promptObjeto(estado.sel, $('pd').value); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { $('pdM').textContent = 'Pedido copiado. Cole no Codex/Claude Code.'; }, () => { baixar('pedido-'+estado.sel+'.md', t); $('pdM').textContent = 'Não consegui copiar; baixei o arquivo.'; }); };
  el.querySelectorAll('.bt').forEach((b, i) => { const k = ['ok','aj','rj'][i]; if(v.estado === k) b.classList.add('on'); b.onclick = () => salvar(k); });
  $('sv').onclick = () => salvar(v.estado || 'aj', true);
}
function salvar(est, soComentario){
  const id = estado.sel, antigo = estado.val[id] || {}, reg = {id, estado: soComentario && !antigo.estado ? 'aj' : est, comentario: $('co').value.trim(), pedido: ($('pd') ? $('pd').value : antigo.pedido) || '', params: estado.params, quando: new Date().toISOString()};
  estado.val[id] = reg; try{ localStorage.setItem('rx-bib-val', JSON.stringify(estado.val)); }catch(e){}
  fetch('/api/biblioteca/validacao', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(reg)})
    .then(r => r.ok ? 'Salvo.' : 'Salvo só neste navegador (o servidor não respondeu).').catch(() => 'Salvo só neste navegador (abra pelo "Abrir estudio.bat").').then(t => { const m = $('msg'); if(m) m.textContent = t; });
  lista(); painel();
}
/* ---------- pedidos para a IA de código ---------- */
function baixar(nome, txt){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'text/markdown;charset=utf-8'})); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function arquivoDoLote(d){ return typeof d.lote === 'number' ? 'modulos/biblioteca/lote'+d.lote+'.js' : 'modulos/biblioteca/meus_objetos.js'; }
const CABECALHO = ['Você vai mexer na BIBLIOTECA DE OBJETOS 3D do Estúdio Raio-X (projeto nesta pasta). ANTES de qualquer alteração leia `AGENTS.md` e `modulos/biblioteca/GUIA.md` e siga o padrão à risca.',
  'Regras de ouro: nomes de partes e de animações já existentes são API pública (os roteiros JSON usam), então só acrescente, nunca renomeie nem apague. Animações são funções puras de t. Tudo procedural, low poly, sem dependências.'];
function promptObjeto(id, pedido){
  const d = LIB.itens[id], r = LIB.construir(id), v = estado.val[id] || {};
  const ps = Object.keys(d.params || {}).map(k => '  - '+k+' = '+JSON.stringify(d.params[k].padrao)+(d.params[k].opcoes ? ' (opções: '+d.params[k].opcoes.join(', ')+')' : '')).join('\n') || '  (nenhum)';
  const an = Object.keys(d.animacoes).map(n => '  - '+n+(d.animacoes[n].loop ? ' (contínua)' : '')+': '+d.animacoes[n].desc).join('\n') || '  (nenhuma)';
  const L = CABECALHO.slice();
  L.push('', '# Pedido de ajuste do objeto `'+id+'` ('+d.nome+')', '', 'Arquivo onde ele está: `'+arquivoDoLote(d)+'` (procure por `id:\''+id+'\'`).',
    'Descrição atual: '+d.descricao, 'Tamanho (L x A x P, m): '+r.dim.map(x => +x.toFixed(2)).join(' x '),
    'Partes: '+Object.keys(r.partes).join(', '), 'Parâmetros:', ps, 'Animações:', an,
    v.estado ? '\nSituação na validação: '+v.estado+(v.comentario ? '. Comentário anterior: '+v.comentario : '') : '',
    '', '## O que o dono quer', (pedido && pedido.trim()) || '(sem texto: melhore o visual e a clareza do objeto sem mudar nomes de partes nem de animações)',
    '', '## Como entregar', '1. Edite só o necessário nesse arquivo (se for animação nova, acrescente em `animacoes`; se for parte nova, dê `nome`).',
    '2. Se criar parâmetro ou animação nova, escreva `desc` curta (a IA de roteiro lê isso).', '3. Teste: abrir `biblioteca.html`, selecionar `'+id+'`, rodar todas as animações e clicar em "🔍 Verificar tudo". Sem erro no console.',
    '4. Acrescente uma linha em `modulos/biblioteca/CHANGELOG.md` (data, `'+id+'`, o que mudou).', '5. Responda em uma frase dizendo o que mudou.');
  return L.join('\n');
}
function promptNovo(f){
  const L = CABECALHO.slice();
  L.push('', '# Pedido de NOVO objeto: `'+f.id+'` ('+f.nome+')', '', 'Crie-o em `modulos/biblioteca/meus_objetos.js` com `LIB.registrar({...})` (lote `\'meus\'`). Use como modelo de estilo 2 ou 3 objetos parecidos de `lote1.js … lote9.js` (leia-os).',
    '', 'O que é: '+f.desc, 'Tamanho aproximado: '+(f.tam || 'use o tamanho real em metros, com a base em y=0'), 'Referência visual: '+(f.ref || '(nenhuma)'),
    'Partes que precisam se mexer (viram partes nomeadas): '+(f.partes || '(escolha as que fizerem sentido)'), 'Animações desejadas (nome: o que faz): '+(f.anims || '(escolha 2 a 4 que expliquem como a coisa funciona)'),
    'Parâmetros desejados (material, cor, tamanho…): '+(f.params || '(escolha os úteis)'),
    '', 'Objetos já existentes (não duplique; reaproveite o estilo): '+LIB.ordem.join(', '),
    '', '## Como entregar', '1. Escreva o objeto e escolha `id` em minúsculas com sublinhado (`'+f.id+'`).', '2. Texturas procedurais do GUIA, 5 a 7 cores, low poly. Base em y=0, centrado.',
    '3. Teste em `biblioteca.html` (ele aparece em "Meus objetos") e clique em "🔍 Verificar tudo".', '4. Linha no `modulos/biblioteca/CHANGELOG.md`.', '5. Responda em uma frase.');
  return L.join('\n');
}
function verificar(){
  const out = [], n = {obj: 0, anim: 0};
  LIB.ordem.forEach(id => { let it; try{ it = LIB.construir(id); n.obj++; }catch(e){ out.push(id+': erro ao construir ('+e.message+')'); return; }
    if(!it.dim.every(isFinite)) out.push(id+': tamanho inválido');
    Object.keys(it.def.animacoes).forEach(nm => { const a = it.def.animacoes[nm]; n.anim++; if(!a.desc) out.push(id+'.'+nm+': falta desc');
      [0, .3, a.dur*.5, a.dur, a.dur*2].forEach(t => { try{ LIB.reset(it.partes); a.aplicar(it.partes, t, {}, it.obj); it.obj.updateMatrixWorld(true); let ruim = false;
        it.obj.traverse(o => { if(!isFinite(o.position.x+o.position.y+o.position.z+o.rotation.x+o.rotation.y+o.rotation.z+o.scale.x+o.scale.y+o.scale.z)) ruim = true; }); if(ruim) out.push(id+'.'+nm+' em t='+t.toFixed(1)+': valor inválido (NaN)'); }
        catch(e){ out.push(id+'.'+nm+' em t='+t.toFixed(1)+': '+e.message); } }); }); });
  const m = n.obj+' objetos e '+n.anim+' animações verificados: '+(out.length ? out.length+' problema(s):\n'+[...new Set(out)].slice(0, 15).join('\n') : 'tudo certo.');
  alert(m); return out;
}
function novoObjeto(){
  const w = document.createElement('div'); w.style.cssText = 'position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:center;justify-content:center';
  w.innerHTML = '<div style="background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px;width:min(560px,92vw);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:8px"><h2 style="margin:0">Novo objeto</h2><p class="mu" style="margin:0">Preencha o que souber; o resto a IA decide. Gera um arquivo de pedido para o Codex ou o Claude Code criar o objeto em <code>meus_objetos.js</code>.</p>'
    + ['id|id curto, sem espaço (ex.: bomba_calor)','nome|Nome (ex.: Bomba de calor)','desc|O que é e como é por fora (uma ou duas frases)','tam|Tamanho aproximado (ex.: 1,2 m de largura por 0,8 m de altura)','ref|Referência (texto ou link de imagem)','partes|Partes que se mexem (ex.: hélice, porta)','anims|Animações (ex.: ligar: a hélice gira; vazar: sai água)','params|Parâmetros (ex.: cor, material)'].map(x => { const [k, ph] = x.split('|'); return '<input data-k="'+k+'" placeholder="'+ph+'" style="width:100%;box-sizing:border-box">'; }).join('')
    + '<div class="row"><button id="nvG" class="on">Baixar pedido (.md)</button><button id="nvC">Copiar pedido</button><button id="nvX">Fechar</button></div><span class="mu" id="nvM"></span></div>';
  document.body.appendChild(w);
  const ler = () => { const f = {}; w.querySelectorAll('input').forEach(i => f[i.dataset.k] = i.value.trim()); f.id = (f.id || f.nome || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); if(!f.nome) f.nome = f.id; return f; };
  const ok = f => { if(!f.id || !f.desc){ w.querySelector('#nvM').textContent = 'Preencha ao menos o nome e o que é.'; return false; } if(LIB.itens[f.id]){ w.querySelector('#nvM').textContent = 'Já existe um objeto com esse id; use "Pedir mudança" nele.'; return false; } return true; };
  w.querySelector('#nvX').onclick = () => w.remove();
  w.querySelector('#nvG').onclick = () => { const f = ler(); if(ok(f)){ baixar('pedido-novo-'+f.id+'.md', promptNovo(f)); w.querySelector('#nvM').textContent = 'Baixado. Entregue ao Codex/Claude Code e depois recarregue a página.'; } };
  w.querySelector('#nvC').onclick = () => { const f = ler(); if(ok(f)) (navigator.clipboard ? navigator.clipboard.writeText(promptNovo(f)) : Promise.reject()).then(() => { w.querySelector('#nvM').textContent = 'Copiado.'; }, () => { baixar('pedido-novo-'+f.id+'.md', promptNovo(f)); }); };
}
